services:
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
#      - elasticsearch
      - jaeger
      - seq

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin
    volumes:
      - seq-data:/data
    ports:
      - "5341:80"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # gRPC
      - "6831:6831/udp" # thrift

#  elasticsearch:
#    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
#    environment:
#      - discovery.type=single-node
#      - xpack.security.enabled=false
#      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
#    ports:
#      - "9200:9200"
#    volumes:
#      - elasticsearch-data:/usr/share/elasticsearch/data
#
#  kibana:
#    image: docker.elastic.co/kibana/kibana:8.15.3
#    environment:
#      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
#    ports:
#      - "5601:5601"
#    depends_on:
#      - elasticsearch

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=rabbit_pass
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

#  grpc-service:
#    build:
#      context: .
#      dockerfile: TestMassTransit.GrpcService/Dockerfile
#    environment:
#      - ASPNETCORE_ENVIRONMENT=Development
#      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
#    ports:
#      - "5273:80"
#    depends_on:
#      - rabbitmq

  sender:
    build:
      context: .
      dockerfile: TestMassTransit.Sender/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__rabbitmq=amqp://user:rabbit_pass@rabbitmq:5672
      - ConnectionStrings__grpc-service=http://grpc-service:80
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "5088:8080"
    depends_on:
      - rabbitmq
#      - grpc-service

  receiver:
    build:
      context: .
      dockerfile: TestMassTransit.Receiver/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__rabbitmq=amqp://user:rabbit_pass@rabbitmq:5672
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "7258:80"
    depends_on:
      - rabbitmq

volumes:
  elasticsearch-data:
  rabbitmq-data:
  seq-data: